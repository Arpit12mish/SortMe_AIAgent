<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select Google Docs</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, Roboto, sans-serif; }
    #status { display: flex; align-items: center; justify-content: center; height: 100%; color: #444; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="status">Loading picker…</div>
  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    // This page runs in the SYSTEM browser (expo-web-browser's
    // openAuthSessionAsync), not an embedded in-app WebView -- Google's own
    // account/session checks inside gapi's picker bootstrap are unreliable
    // or outright blocked in an embedded WKWebView regardless of cookie
    // settings, the same restriction that's why the OAuth sign-in itself
    // already uses the system browser (see oauth.ts). Loaded from our
    // backend with a short-lived, single-purpose token (see
    // PickerSessionService). It hands the selected file ids back to the app
    // by redirecting to the app's own URL scheme -- it never itself calls
    // /api/connections/google-docs/import.
    var PICKER_REDIRECT_URI = 'sortme://picker-redirect';

    function redirectBack(params) {
      var usp = new URLSearchParams(params);
      window.location.href = PICKER_REDIRECT_URI + '?' + usp.toString();
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    var params = new URLSearchParams(window.location.search);
    var pickerToken = params.get('pickerToken');
    if (!pickerToken) {
      setStatus('Missing picker session token.');
      redirectBack({ error: 'missing_picker_token' });
    } else {
      fetch('/api/connections/google-docs/picker-page-data?pickerToken=' + encodeURIComponent(pickerToken))
        .then(function (res) {
          if (!res.ok) throw new Error('picker session expired or invalid');
          return res.json();
        })
        .then(function (data) {
          gapi.load('picker', { callback: function () { openPicker(data.accessToken, data.appId); } });
        })
        .catch(function (err) {
          setStatus('Could not start the picker: ' + err.message);
          redirectBack({ error: String(err.message || err) });
        });
    }

    function openPicker(accessToken, appId) {
      setStatus('');
      var docsView = new google.picker.DocsView(google.picker.ViewId.DOCUMENTS)
        .setMimeTypes('application/vnd.google-apps.document')
        .setSelectFolderEnabled(false);

      var builder = new google.picker.PickerBuilder()
        .addView(docsView)
        .setOAuthToken(accessToken)
        .setCallback(pickerCallback);

      if (appId) {
        builder.setAppId(appId);
      }

      builder.build().setVisible(true);
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        var fileIds = (data.docs || []).map(function (doc) { return doc.id; });
        redirectBack({ fileIds: fileIds.join(',') });
      } else if (data.action === google.picker.Action.CANCEL) {
        redirectBack({ cancelled: '1' });
      }
    }
  </script>
</body>
</html>
